name: Build Android APK

on:
  push:
    branches: [main, master]
    paths:
      - 'index.html'
      - 'app.css'
      - 'js/**'
      - 'icon-192.png'
      - 'icon-512.png'
      - 'icon-maskable-512.png'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Kunci tandatangan tetap supaya APK baharu boleh menimpa versi lama.
      # Tanpa kunci tetap, setiap build guna debug keystore berbeza dan
      # Android menolak kemas kini dengan "package conflict".
      - name: Sediakan kunci tandatangan
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 belum diset."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/waktusolat.p12"
          {
            echo "WS_KEYSTORE=$RUNNER_TEMP/waktusolat.p12"
            echo "WS_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "WS_KEY_ALIAS=$KEY_ALIAS"
            echo "WS_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Sahkan tandatangan APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          "$BT/apksigner" verify --print-certs \
            android/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: waktu-solat-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Baca nombor versi
        id: ver
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' android/app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Versi: $VERSION"

      - name: Terbit Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${{ steps.ver.outputs.version }}
          gh release create "v$VERSION" \
            --title "Waktu Solat v$VERSION" \
            --generate-notes \
            --target "$GITHUB_SHA" || true
          gh release upload "v$VERSION" \
            android/app/build/outputs/apk/release/app-release.apk --clobber
