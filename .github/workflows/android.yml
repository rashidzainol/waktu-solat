name: Build Android APK

on:
  push:
    branches: [main, master]
    paths:
      - 'index.html'
      - 'app.css'
      - 'js/**'
      - 'icon-192.png'
      - 'icon-512.png'
      - 'icon-maskable-512.png'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: waktu-solat-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Baca nombor versi
        id: ver
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' android/app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Versi: $VERSION"

      - name: Terbit Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${{ steps.ver.outputs.version }}
          gh release create "v$VERSION" \
            --title "Waktu Solat v$VERSION" \
            --generate-notes \
            --target "$GITHUB_SHA" || true
          gh release upload "v$VERSION" \
            android/app/build/outputs/apk/debug/app-debug.apk --clobber
